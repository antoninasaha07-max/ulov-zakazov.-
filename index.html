<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Улов заказов — фриланс-платформа</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f8fc;color:#18312b}
header{background:#fff;padding:18px 7%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;border-bottom:1px solid #e2e9e3}
.logo{font-size:24px;font-weight:bold;color:#167346}
nav a{margin-left:18px;text-decoration:none;color:#18312b}
.hero{padding:65px 7%;text-align:center;background:#e4f3e9}
.hero h1{font-size:clamp(30px,5vw,48px);margin:0 0 15px}
.hero p{font-size:18px;color:#526b5b}
.search{display:flex;max-width:650px;margin:25px auto 0;gap:10px}
input,select{padding:14px;border:1px solid #cbd8ce;border-radius:9px;font-size:16px;min-width:0}
.search input{flex:1}
button{padding:14px 22px;border:0;border-radius:9px;background:#167346;color:white;font-size:16px;cursor:pointer}
button:hover{background:#105b36}
section{padding:45px 7%}
h2{font-size:30px;margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{padding:22px;background:white;border:1px solid #e2e9e3;border-radius:14px}
.card h3{margin-top:0}
.muted{color:#718078}
.price{font-weight:bold;color:#167346;font-size:18px}
.cta{text-align:center;background:#18312b;color:white;padding:40px 7%}
.cta p{color:#d3e1d8}
footer{padding:25px 7%;text-align:center;color:#718078}
@media(max-width:600px){header{flex-direction:column}nav a{margin:0 7px}.search{flex-direction:column}.hero{padding:45px 5%}}
 =function searchOrders   </head>
<body>
<header>
  <div class="logo">🎣 Улов заказов</div>
  <nav>
    <a href="#orders">Заказы</a>
    <a href="#categories">Специализации</a>
    <a href="#about">О платформе</a>
  </nav>
</header>

<div class="hero">
  <h1>Лови заказы. Работай свободно.</h1>
  <p>Платформа для фрилансеров, где можно найти интересную работу и клиентов.</p>
  <div class="search">
    <input id="searchInput" type="text" placeholder="Какую работу ищешь?">
    <button onclick="searchOrders()">Найти</button>
  </div>
</div>
<section id="roles">
  <h2>Добро пожаловать на Улов заказов!</h2>

  <div class="grid">
    <div class="card">
      <h3>💼 Я фрилансер</h3>
      <p>Ищи заказы и зарабатывай!</p>
      <button onclick="document.getElementById('freelancer').scrollIntoView({behavior:'smooth'})">Войти фрилансеру</button>
    </div>

    <div class="card">
      <h3>📋 Я заказчик</h3>
      <p>Размещай заказы и находи исполнителей!</p>
      <button onclick="document.getElementById('customer').scrollIntoView({behavior:'smooth'})">Войти заказчику</button>
    </div>

    <div class="card">
      <h3>🐱 Кот-помощник</h3>
      <p>Я помогу разобраться с платформой!</p>
      <button onclick="alert('Привет! Я кот-помощник Улов заказов! Чем могу помочь?')">Позвать котика</button>
    </div>
  </div>
</section>
<section id="freelancer">
  <h2>💼 Регистрация фрилансера</h2>
  <div class="card">
    <input type="text" placeholder="Ваше имя">
    <input type="email" placeholder="Ваш Email">
    <input type="text" placeholder="Ваша специализация">
    <button onclick="alert('Анкета фрилансера подготовлена!')">Зарегистрироваться</button>
  </div>
</section>

<section id="customer">
  <h2>📋 Регистрация заказчика</h2>
  <div class="card">
    <input type="text" placeholder="Ваше имя">
    <input type="email" placeholder="Ваш Email">
    <textarea placeholder="Какой специалист вам нужен?"></textarea>
    <button onclick="alert('Анкета заказчика подготовлена!')">Зарегистрироваться</button>
  </div>
</section>
  <section id="categories">
  <h2>Выбери свою специализацию</h2>
  <div class="grid">
    <div class="card"><h3>🎨 Дизайн</h3><p>Логотипы, баннеры, оформление</p></div>
    <div class="card"><h3>✍️ Тексты</h3><p>Статьи, переводы, описания</p></div>
    <div class="card"><h3>💻 Разработка</h3><p>Сайты, приложения, программирование</p></div>
    <div class="card"><h3>📱 Социальные сети</h3><p>Контент, публикации, продвижение</p></div>
  </div>
</section>

<section id="orders">
  <h2>Примеры заказов</h2>
  <div class="grid" id="orderList">
    <div class="card order"><h3>Создать логотип для магазина</h3><p>Нужен современный логотип для небольшого бизнеса.</p><p class="price">300 000 сум</p><p class="muted">Дизайн</p></div>
    <div class="card order"><h3>Оформить страницу Instagram</h3><p>Подготовить обложки и несколько публикаций.</p><p class="price">250 000 сум</p><p class="muted">Социальные сети</p></div>
    <div class="card order"><h3>Создать простой сайт</h3><p>Одностраничный сайт для специалиста.</p><p class="price">800 000 сум</p><p class="muted">Разработка</p></div>
  </div>
  <p id="noResults" style="display:none">По вашему запросу ничего не найдено.</p>
</section>

<div class="cta" id="about">
  <h2>Твой следующий заказ уже рядом</h2>
  <p>Развивай навыки, находи клиентов и зарабатывай на любимом деле.</p>
  <button onclick="document.getElementById('orders').scrollIntoView({behavior:'smooth'})">Смотреть заказы</button>
</div>

<footer>© 2026 Улов заказов. Фриланс-платформа.</footer>

<script>
function searchOrders(){
  const query=document.getElementById('searchInput').value.toLowerCase().trim();
  const orders=document.querySelectorAll('.order');
  let found=0;
  orders.forEach(order=>{
    const match=order.textContent.toLowerCase().includes(query);
    order.style.display=match?'':'none';
    if(match)found++;
  });
  document.getElementById('noResults').style.display=found?'none':'block';
  document.getElementById('orders').scrollIntoView({behavior:'smooth'});
}
document.getElementById('searchInput').addEventListener('keydown',e=>{
  if(e.key==='Enter')searchOrders();
});
</script>
</body>
</html>
